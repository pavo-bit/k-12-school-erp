global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "alerts@school-erp.com"
  smtp_auth_username: "alerts@school-erp.com"
  smtp_auth_password: "${SMTP_PASSWORD}"

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "email-notifications"
  routes:
    - match:
        severity: critical
      receiver: "critical-notifications"
      continue: true
    - match:
        severity: warning
      receiver: "warning-notifications"

receivers:
  - name: "email-notifications"
    email_configs:
      - to: "team@school-erp.com"
        send_resolved: true

  - name: "critical-notifications"
    email_configs:
      - to: "oncall@school-erp.com"
        send_resolved: true
    # Uncomment for Slack integration:
    # slack_configs:
    #   - api_url: "${SLACK_WEBHOOK_URL}"
    #     channel: "#alerts-critical"
    #     send_resolved: true

  - name: "warning-notifications"
    email_configs:
      - to: "team@school-erp.com"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
