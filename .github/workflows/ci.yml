name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap runtime roles (erp_app, erp_migrations)
        run: pnpm --filter @school-erp/db bootstrap
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_erp_test
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_erp_test
      - run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_erp_test
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_erp_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_erp_test
          TEST_APP_DATABASE_URL: postgresql://erp_app:erp_app@localhost:5432/school_erp_test
          NODE_ENV: test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: apps/web/.next
          retention-days: 7

  smoke:
    name: Smoke (prod build + live HTTP checks)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_erp_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_erp_smoke
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @school-erp/db bootstrap
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - name: Start web in the background
        run: |
          nohup pnpm --filter @school-erp/web start > web.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/healthz > /dev/null 2>&1; then
              echo "web is up after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "web failed to become healthy; last log lines:"
          tail -n 40 web.log
          exit 1
        env:
          PORT: "3000"
          HOSTNAME: "0.0.0.0"
          NODE_ENV: production
          BETTER_AUTH_SECRET: 01234567890123456789012345678901
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ORIGIN_SECRET: ci-smoke-secret
      - name: Smoke checks
        run: |
          set -e
          echo "healthz -> $(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = "200"
          curl -sf -c /tmp/smoke-cookies.txt -X POST http://localhost:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@greenwood.local","password":"Password123!"}' | grep -q userId
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/smoke-cookies.txt http://localhost:3000/api/v1/me?school=greenwood)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/smoke-cookies.txt http://localhost:3000/api/v1/students?school=greenwood)" = "200"
          echo "smoke checks passed"