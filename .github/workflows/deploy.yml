name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/erp-github-deploy
          aws-region: ap-south-1

      - name: Build and push container images
        run: |
          # Build and push worker and pdf-worker images to ECR
          # Deploy web via OpenNext
          npx open-next build

      - name: Deploy Lambda functions
        run: |
          # Deploy via AWS CDK or Terraform
          echo "Deploy Lambda functions, update S3, invalidate CloudFront"

      - name: Run migrations
        run: |
          # Run migrations via a one-off Lambda or ECS task
          echo "Run database migrations"
