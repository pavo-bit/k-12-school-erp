openapi: 3.1.0
info:
  title: School ERP API
  description: Multi-tenant K-12 school ERP SaaS API
  version: 1.0.0
  contact:
    name: School ERP Team
    url: https://github.com/pavo-bit/k-12-school-erp

servers:
  - url: https://api.school-erp.com/api/v1
    description: Production
  - url: https://staging.school-erp.com/api/v1
    description: Staging
  - url: http://localhost:3000/api/v1
    description: Development

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_token

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: object

    Student:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        admissionNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other, prefer_not_to_say]
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          type: string
          enum: [active, inactive, graduated, transferred, withdrawn]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        totalPaise:
          type: integer
        paidPaise:
          type: integer
        status:
          type: string
          enum: [draft, issued, partial, paid, overdue, cancelled]
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date

    AttendanceSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        sessionType:
          type: string
        status:
          type: string
          enum: [open, closed, submitted]

paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string

  /readyz:
    get:
      summary: Readiness check
      responses:
        "200":
          description: Service is ready
        "503":
          description: Service is not ready

  /metrics:
    get:
      summary: Metrics endpoint
      responses:
        "200":
          description: Service metrics

  /students:
    get:
      summary: List students
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Student"
    post:
      summary: Create student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [admissionNumber, firstName, dateOfBirth, gender]
              properties:
                admissionNumber:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                dateOfBirth:
                  type: string
                  format: date
                gender:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
      responses:
        "201":
          description: Student created
        "400":
          description: Validation error

  /fees/invoices:
    get:
      summary: List invoices
      parameters:
        - name: studentId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of invoices
    post:
      summary: Create invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, academicYearId, financialYear, invoiceNumber, issueDate, dueDate, invoiceLines]
              properties:
                studentId:
                  type: string
                  format: uuid
                academicYearId:
                  type: string
                  format: uuid
                financialYear:
                  type: string
                invoiceNumber:
                  type: string
                issueDate:
                  type: string
                  format: date-time
                dueDate:
                  type: string
                  format: date-time
                status:
                  type: string
                invoiceLines:
                  type: array
                  items:
                    type: object
                    properties:
                      feeHeadId:
                        type: string
                        format: uuid
                      amountPaise:
                        type: integer
                      concessionPaise:
                        type: integer
                      netPaise:
                        type: integer
      responses:
        "201":
          description: Invoice created

  /attendance/sessions:
    get:
      summary: List attendance sessions
      parameters:
        - name: sectionId
          in: query
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of sessions
    post:
      summary: Create attendance session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sectionId, date, sessionType]
              properties:
                sectionId:
                  type: string
                  format: uuid
                date:
                  type: string
                  format: date-time
                sessionType:
                  type: string
                status:
                  type: string
      responses:
        "201":
          description: Session created

  /attendance/records:
    get:
      summary: List attendance records
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of records
    post:
      summary: Mark attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, studentId, status]
              properties:
                sessionId:
                  type: string
                  format: uuid
                studentId:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [present, absent, late, half_day]
      responses:
        "201":
          description: Attendance marked

  /hr/staff:
    get:
      summary: List staff
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: employeeCode
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of staff
    post:
      summary: Create staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeCode, joiningDate]
              properties:
                employeeCode:
                  type: string
                userId:
                  type: string
                  format: uuid
                designationId:
                  type: string
                  format: uuid
                departmentId:
                  type: string
                  format: uuid
                joiningDate:
                  type: string
                  format: date-time
                status:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
      responses:
        "201":
          description: Staff created

  /exams/terms:
    get:
      summary: List exam terms
      parameters:
        - name: academicYearId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of exam terms
    post:
      summary: Create exam term
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academicYearId, name, startDate, endDate]
              properties:
                academicYearId:
                  type: string
                  format: uuid
                name:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                status:
                  type: string
      responses:
        "201":
          description: Exam term created

  /admissions/enquiries:
    get:
      summary: List enquiries
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: classSought
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of enquiries
    post:
      summary: Create enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentName, guardianPhone, classSought]
              properties:
                studentName:
                  type: string
                guardianPhone:
                  type: string
                classSought:
                  type: string
                source:
                  type: string
                  enum: [website, walk_in, referral, advertisement, other]
                status:
                  type: string
      responses:
        "201":
          description: Enquiry created

  /reports:
    get:
      summary: List reports
      parameters:
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of reports
    post:
      summary: Create report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name]
              properties:
                type:
                  type: string
                  enum: [attendance, fee_collection, enrollment, exam_results, student_list, custom]
                name:
                  type: string
                description:
                  type: string
                filters:
                  type: object
                schedule:
                  type: string
                  enum: [none, daily, weekly, monthly]
      responses:
        "201":
          description: Report created

  /audit-logs:
    get:
      summary: List audit logs
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of audit logs

  /webhooks/payments:
    post:
      summary: Payment webhook handler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, payload]
              properties:
                event:
                  type: string
                payload:
                  type: object
      responses:
        "200":
          description: Webhook processed

  /mobile/parent/children:
    get:
      summary: List children linked to the authenticated parent
      description: Requires an active guardian-to-student link in the resolved school.
      responses:
        "200":
          description: Linked children
        "401":
          description: Authentication required
        "403":
          description: Parent relationship required

  /mobile/parent/children/{studentId}/attendance:
    get:
      summary: Get submitted attendance records for a linked child
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Submitted attendance records
        "404":
          description: Child not linked to this parent

  /mobile/parent/children/{studentId}/fees:
    get:
      summary: Get invoices, payment history and receipt metadata for a linked child
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Fee ledger view for the linked child
        "404":
          description: Child not linked to this parent

  /mobile/parent/children/{studentId}/results:
    get:
      summary: List published results and report cards for a linked child
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Published results

  /mobile/parent/children/{studentId}/results/{reportCardId}:
    get:
      summary: Download a published report card PDF for a linked child
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: reportCardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: PDF report card
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Report card not found or not accessible

  /mobile/parent/announcements:
    get:
      summary: List announcements published for parents
      responses:
        "200":
          description: Published parent and school announcements

  /mobile/teacher/profile:
    get:
      summary: Get the authenticated teacher profile
      responses:
        "200":
          description: Teacher profile
        "403":
          description: Active staff profile required

  /mobile/teacher/sections:
    get:
      summary: List sections and subjects assigned to the authenticated teacher
      responses:
        "200":
          description: Assigned sections

  /mobile/teacher/sections/{sectionId}/roster:
    get:
      summary: Get active roster for an assigned section
      parameters:
        - name: sectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assigned section roster
        "403":
          description: Section is not assigned to the teacher

  /mobile/teacher/attendance/sessions:
    get:
      summary: List sessions for an assigned section
      parameters:
        - name: sectionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Attendance sessions
    post:
      summary: Create an attendance session for an assigned section
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sectionId, date]
              properties:
                sectionId:
                  type: string
                  format: uuid
                date:
                  type: string
                  format: date
                sessionType:
                  type: string
                  enum: [daily, full_day, morning, afternoon]
      responses:
        "201":
          description: Attendance session created
        "403":
          description: Section is not assigned to the teacher

  /mobile/teacher/attendance/records:
    get:
      summary: Get records for an assigned attendance session
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Attendance records
    post:
      summary: Mark and optionally submit attendance for an assigned session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, records]
              properties:
                sessionId:
                  type: string
                  format: uuid
                records:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [studentId, status]
                    properties:
                      studentId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [present, absent, late, half_day, excused]
                submit:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Attendance saved
        "403":
          description: Session is not assigned to the teacher
        "422":
          description: Student is not in the assigned active roster

  /mobile/teacher/attendance/sync:
    post:
      summary: Idempotently sync offline attendance operations
      description: Accepts at most 10 client-generated operations per request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [operationId, deviceId, sessionId, records]
                    properties:
                      operationId:
                        type: string
                        minLength: 16
                      deviceId:
                        type: string
                      sessionId:
                        type: string
                        format: uuid
                      records:
                        type: array
                        items:
                          type: object
                          required: [studentId, status]
                          properties:
                            studentId:
                              type: string
                              format: uuid
                            status:
                              type: string
                              enum: [present, absent, late, half_day, excused]
                      submit:
                        type: boolean
      responses:
        "200":
          description: Operations synced
        "409":
          description: Operation is already in progress

  /mobile/teacher/announcements:
    get:
      summary: List announcements published for teachers and staff
      responses:
        "200":
          description: Published teacher and school announcements
