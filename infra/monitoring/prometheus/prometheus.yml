global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: school-erp
    environment: production

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "school-erp-web"
    metrics_path: "/metrics/prometheus"
    static_configs:
      - targets: ["host.docker.internal:3000"]
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]